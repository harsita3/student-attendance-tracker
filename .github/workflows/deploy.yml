name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/student-attendence
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/student-attendence-frontend
      VERSION: v${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: BACKEND
          file: BACKEND/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: FRONTEND
          file: FRONTEND/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ env.VERSION }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo systemctl enable --now docker
            sudo mkdir -p /opt/attendance/data
            if [ -f "$HOME/attendance-data/attendance.db" ] && [ ! -f /opt/attendance/data/attendance.db ]; then sudo cp "$HOME/attendance-data/attendance.db" /opt/attendance/data/; fi
            sudo docker pull ${{ env.IMAGE }}:${{ env.VERSION }}
            sudo docker pull ${{ env.FRONTEND_IMAGE }}:${{ env.VERSION }}
            sudo docker rm -f attendance-tracker attendance-frontend || true
            sudo docker run -d --name attendance-tracker --restart unless-stopped -p 8001:8001 -v /opt/attendance/data:/app/data -e SECRET_KEY='${{ secrets.JWT_SECRET_KEY }}' ${{ env.IMAGE }}:${{ env.VERSION }}
            sudo docker run -d --name attendance-frontend --restart unless-stopped -p 80:80 ${{ env.FRONTEND_IMAGE }}:${{ env.VERSION }}
            sudo docker image prune -af
            sudo docker ps
