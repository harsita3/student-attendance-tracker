name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/student-attendance-tracker
      VERSION: v${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: BACKEND
          file: BACKEND/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo systemctl enable --now docker
            mkdir -p $HOME/attendance-data
            sudo docker pull ${{ env.IMAGE }}:${{ env.VERSION }}
            sudo docker rm -f attendance-tracker || true
            sudo docker run -d --name attendance-tracker --restart unless-stopped -p 8001:8001 -v $HOME/attendance-data:/app/data -e DB_URL=sqlite:////app/data/attendance.db ${{ env.IMAGE }}:${{ env.VERSION }}
            sudo docker image prune -af
            sudo docker ps --filter name=attendance-tracker
